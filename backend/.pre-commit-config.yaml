repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend strict)
        entry: bash -c 'cd backend && mypy --strict src'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: bandit
        name: bandit (backend security)
        entry: bash -c 'cd backend && bandit -r src'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
