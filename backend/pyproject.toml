[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expense-receipt-processor-backend"
version = "0.1.0"
description = "Expense Receipt Processor backend (FastAPI + SQLAlchemy + Alembic)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pyjwt>=2.9",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.1,<4.1",
  "anthropic>=0.34",
  "pdfplumber>=0.11",
  "pillow>=10.4",
  "python-magic-bin>=0.4.14; sys_platform == 'win32'",
  "python-magic>=0.4.27; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
  "bandit>=1.7",
  "pre-commit>=3.8",
  "pip-audit>=2.7",
  "mcp>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP017", "B008"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "passlib.*",
  "pdfplumber.*",
  "magic.*",
  "anthropic.*",
  "sqlalchemy.*",
  "fastapi.*",
  "pydantic.*",
  "pydantic_settings.*",
  "jwt.*",
  "alembic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
